<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Aura Notes</title>
<style>
:root{--glass:rgba(255,255,255,.04);--border:rgba(255,255,255,.09);--accent:#8b5cf6;--accent2:#6d28d9;--muted:#94a3b8;--text:#f8fafc;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;color:var(--text);background:#020617;
  background-image:radial-gradient(circle at 15% 50%,rgba(76,29,149,.18),transparent 50%),radial-gradient(circle at 85% 30%,rgba(30,58,138,.18),transparent 50%);
  background-attachment:fixed;transition:background-color .5s}
body.focus{background:#000}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border)}

/* Nav */
nav{order:2;display:flex;justify-content:space-around;align-items:stretch;padding:6px 6px calc(6px + var(--sab));border-width:1px 0 0;z-index:30;transition:opacity .5s,transform .5s}
.brand{display:none}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:10px;font-weight:500;transition:.2s}
.nav-item.active{color:#fff;background:linear-gradient(to bottom,rgba(139,92,246,.25),transparent)}
.nav-item.trash.active{color:#fca5a5}
.spacer{display:none}

/* Main */
main{order:1;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
header{padding:calc(var(--sat) + 22px) 22px 10px;flex:none;transition:opacity .5s,transform .5s}
header h1{font-size:30px;font-weight:600;letter-spacing:-.5px}
header p{color:var(--muted);margin-top:4px;font-size:14px}
.tools{display:flex;gap:10px;margin-top:14px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px}
.search input{flex:1;min-width:0;font-size:15px;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:#64748b}
.pill{padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;background:rgba(239,68,68,.15);color:#fca5a5}
.hidden{display:none!important}

.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:8px 22px calc(110px + var(--sab));-webkit-overflow-scrolling:touch}
.view.active{display:block}
.view::-webkit-scrollbar{width:0}

/* Notes grid */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:in .35s ease-out both}
.card:active{transform:scale(.99)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acts{display:flex;gap:6px;flex:none}
.acts button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.acts button svg{width:16px;height:16px}
.acts button:active{background:rgba(255,255,255,.18);color:#fff}
.acts .danger:active{color:#f87171}.acts .ok:active{color:#34d399}
.card p{color:#cbd5e1;font-size:14px;line-height:1.55;margin-top:8px;font-weight:300;white-space:pre-wrap;word-break:break-word;flex:1}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#64748b}
.chip{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;color:#64748b;text-align:center;gap:10px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.empty .ic svg{width:30px;height:30px;opacity:.5}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(84px + var(--sab));width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:40;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 22px rgba(139,92,246,.55);transition:transform .2s}
.fab:active{transform:scale(.92)}.fab svg{width:28px;height:28px;stroke-width:2.4}

/* Matrix */
.matrix{display:flex;flex-direction:column;gap:14px}
.side{border-radius:20px;display:flex;flex-direction:column;max-height:220px}
.side-h{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border-radius:20px 20px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#cbd5e1;font-weight:500}
.count{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:6px;font-size:12px;color:#fff}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{border-radius:18px;display:flex;flex-direction:column;overflow:hidden;min-height:190px;border-top-width:2px}
.q-h{padding:10px 6px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.q1{border-top-color:rgba(239,68,68,.6)}.q1 .q-h{background:rgba(239,68,68,.12);color:#fecaca}
.q2{border-top-color:rgba(59,130,246,.6)}.q2 .q-h{background:rgba(59,130,246,.12);color:#bfdbfe}
.q3{border-top-color:rgba(234,179,8,.6)}.q3 .q-h{background:rgba(234,179,8,.12);color:#fef08a}
.q4{border-top-color:rgba(100,116,139,.6)}.q4 .q-h{background:rgba(100,116,139,.12);color:#cbd5e1}
.zone{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;border:2px dashed transparent;border-radius:12px;margin:4px;transition:.2s}
.zone.over{border-color:var(--accent);background:rgba(139,92,246,.1)}
.mini{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05)}
.mini:active{background:rgba(255,255,255,.12)}
.mini.drag{opacity:.5}
.mini h4{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini p{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.hint{font-size:12px;color:#64748b;text-align:center;margin-top:10px}

/* Zen */
.zen{display:flex;flex-direction:column;height:100%;min-height:440px;max-width:760px;margin:0 auto;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:24px;padding:20px}
.zen-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.timer{font-size:42px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.btn{padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;background:rgba(255,255,255,.1);color:#cbd5e1}
.btn:active{opacity:.7}
.btn.p{background:var(--accent2);color:#fff}.btn.r{background:#dc2626;color:#fff}.btn.g{background:#059669;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.durs{display:flex;gap:6px;margin-bottom:14px}
.durs button{padding:6px 12px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.07);color:var(--muted)}
.durs button.on{background:rgba(139,92,246,.3);color:#fff}
.zen-title{font:500 26px Georgia,'Times New Roman',serif;width:100%;margin-bottom:14px;-webkit-user-select:text;user-select:text}
.zen-text{font:300 19px/1.7 Georgia,'Times New Roman',serif;color:#cbd5e1;width:100%;flex:1;resize:none;min-height:180px;-webkit-user-select:text;user-select:text}
.zen-title::placeholder,.zen-text::placeholder{color:#475569}
body.focus nav,body.focus header{opacity:0;pointer-events:none}
body.focus nav{transform:translateY(100%)}body.focus header{transform:translateY(-20px)}
body.focus .durs{visibility:hidden}

/* Modal / sheets */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:640px;background:#0f172a;border:1px solid var(--border);border-radius:26px 26px 0 0;overflow:hidden;animation:up .25s ease-out;padding-bottom:var(--sab)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;font-weight:500}
.sheet-b{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.in-title{font-size:22px;font-weight:600;width:100%;-webkit-user-select:text;user-select:text}
.in-text{font-size:16px;line-height:1.6;color:#cbd5e1;width:100%;height:180px;resize:none;-webkit-user-select:text;user-select:text}
.in-title::placeholder,.in-text::placeholder{color:#64748b}
.sheet-f{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;background:rgba(0,0,0,.35)}
.mv{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);font-size:15px;text-align:left;width:100%}
.mv.cur{outline:2px solid var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--sab));transform:translate(-50%,20px);background:#1e293b;border:1px solid var(--border);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:90;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Tablet / desktop */
@media(min-width:768px){
  .app{flex-direction:row}
  nav{order:0;width:240px;flex-direction:column;justify-content:flex-start;padding:28px 14px;border-width:0 1px 0 0;gap:6px}
  .brand{display:flex;align-items:center;gap:12px;padding:0 12px;margin-bottom:26px;font-size:20px;font-weight:600}
  .brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(139,92,246,.35)}
  .nav-item{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px}
  .nav-item.active{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 var(--accent)}
  .nav-item.trash{margin-top:auto}
  header,.view{padding-left:40px;padding-right:40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .fab{bottom:36px;right:40px}
  .view{padding-bottom:110px}
  .matrix{flex-direction:row;height:100%}
  .side{width:250px;max-height:none;flex:none}
  .quad{flex:1;grid-template-rows:1fr 1fr}
  .toast{bottom:40px}
}
</style>
</head>
<body>
<div class="app">

<nav class="glass">
  <div class="brand"><i><svg viewBox="0 0 24 24" style="stroke-width:2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></i>Notes</div>
  <button class="nav-item active" data-tab="inbox"><svg viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-4l-2 2h-4l-2-2H4"/></svg><span>Inbox</span></button>
  <button class="nav-item" data-tab="matrix"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg><span>Matrix</span></button>
  <button class="nav-item" data-tab="zenflow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4-.7-.7M6.3 6.3l-.7-.7m12.8 0-.7.7M6.3 17.7l-.7.7"/></svg><span>Zen Flow</span></button>
  <button class="nav-item trash" data-tab="trash"><svg viewBox="0 0 24 24"><path d="M19 7l-.9 12.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg><span>Trash</span></button>
</nav>

<main>
  <header>
    <h1 id="title">Inbox</h1>
    <p id="subtitle">All your captured thoughts.</p>
    <div class="tools" id="tools">
      <label class="search glass" id="searchBox"><svg viewBox="0 0 24 24" style="width:18px;height:18px;color:#64748b"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search notes" autocomplete="off"></label>
      <button class="pill hidden" id="emptyTrash">Empty trash</button>
    </div>
  </header>

  <!-- Inbox / Trash -->
  <section class="view active" id="view-grid">
    <div id="empty" class="empty hidden"><div class="ic"><svg viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-4l-2 2h-4l-2-2H4"/></svg></div><div id="emptyText" style="font-size:17px;color:#cbd5e1">No notes here</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Matrix -->
  <section class="view" id="view-matrix">
    <div class="matrix">
      <div class="side glass">
        <div class="side-h"><span>Unassigned</span><span class="count" id="uCount">0</span></div>
        <div class="zone" id="zone-unassigned" data-zone="unassigned"></div>
      </div>
      <div class="quad">
        <div class="q q1 glass"><div class="q-h">Do First<br>Urgent &amp; Important</div><div class="zone" id="zone-q1" data-zone="q1"></div></div>
        <div class="q q2 glass"><div class="q-h">Schedule<br>Not Urgent &amp; Important</div><div class="zone" id="zone-q2" data-zone="q2"></div></div>
        <div class="q q3 glass"><div class="q-h">Delegate<br>Urgent &amp; Not Important</div><div class="zone" id="zone-q3" data-zone="q3"></div></div>
        <div class="q q4 glass"><div class="q-h">Eliminate<br>Neither</div><div class="zone" id="zone-q4" data-zone="q4"></div></div>
      </div>
    </div>
    <p class="hint">Tap a note to choose where it goes.</p>
  </section>

  <!-- Zen -->
  <section class="view" id="view-zenflow">
    <div class="zen">
      <div class="durs" id="durs"><button data-m="15">15 min</button><button data-m="25" class="on">25 min</button><button data-m="50">50 min</button></div>
      <div class="zen-top">
        <div class="row" style="gap:14px">
          <div class="timer" id="zenTime">25:00</div>
          <div class="row"><button class="btn p" id="zenToggle">Start Focus</button><button class="btn" id="zenReset">Reset</button></div>
        </div>
        <button class="btn g" id="zenSave">Save to Inbox</button>
      </div>
      <input class="zen-title" id="zenTitle" placeholder="What are you focusing on?" autocomplete="off">
      <textarea class="zen-text" id="zenText" placeholder="Start writing... The world will fade away."></textarea>
    </div>
  </section>

  <button class="fab" id="fab" aria-label="New note"><svg viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg></button>
</main>
</div>

<!-- Note modal -->
<div class="modal" id="noteModal"><div class="sheet">
  <div class="sheet-h"><span id="noteModalTitle">Create Note</span><button id="noteClose" style="color:#94a3b8" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 18 18 6M6 6l12 12"/></svg></button></div>
  <div class="sheet-b">
    <input type="hidden" id="noteId">
    <input class="in-title" id="noteTitle" placeholder="Note Title" maxlength="120" autocomplete="off">
    <textarea class="in-text" id="noteText" placeholder="Write your ideas here..."></textarea>
  </div>
  <div class="sheet-f"><button class="btn" id="noteCancel">Cancel</button><button class="btn p" id="noteSave">Save Note</button></div>
</div></div>

<!-- Move sheet -->
<div class="modal" id="moveModal"><div class="sheet">
  <div class="sheet-h"><span>Move to</span><button id="moveClose" style="color:#94a3b8" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 18 18 6M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="moveList"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const KEY='aura_notes_db_v2', DRAFT='aura_zen_draft';
const $=id=>document.getElementById(id);
const ZONES=[['unassigned','Unassigned','#64748b'],['q1','Do First','#ef4444'],['q2','Schedule','#3b82f6'],['q3','Delegate','#eab308'],['q4','Eliminate','#94a3b8']];
const TABS={
  inbox:{t:'Inbox',s:'All your captured thoughts.',v:'view-grid'},
  matrix:{t:'Eisenhower Matrix',s:'Prioritize your notes.',v:'view-matrix'},
  zenflow:{t:'Zen Flow',s:'Distraction-free focus.',v:'view-zenflow'},
  trash:{t:'Trash',s:'Restore notes or delete them forever.',v:'view-grid'}
};
let notes=[],tab='inbox',query='';

const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){
  try{notes=JSON.parse(ls.get(KEY))||[]}catch{notes=[]}
  if(!Array.isArray(notes))notes=[];
  notes=notes.map(n=>({id:n.id||uid(),title:n.title||'',content:n.content||'',matrixZone:ZONES.some(z=>z[0]===n.matrixZone)?n.matrixZone:'unassigned',isTrashed:!!n.isTrashed,updatedAt:n.updatedAt||Date.now()}));
}
const persist=()=>ls.set(KEY,JSON.stringify(notes));

/* Toast / sound */
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
let actx;
function unlock(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch{}}
document.addEventListener('touchstart',unlock,{once:true});document.addEventListener('click',unlock,{once:true});
function beep(n=3){try{unlock();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.4;o.frequency.value=660;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.3)}}catch{}
  if(navigator.vibrate)navigator.vibrate([250,120,250])}

/* Navigation */
function switchTab(id){
  tab=id;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  $('title').textContent=TABS[id].t;$('subtitle').textContent=TABS[id].s;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===TABS[id].v));
  $('fab').classList.toggle('hidden',id!=='inbox');
  $('searchBox').classList.toggle('hidden',id!=='inbox'&&id!=='trash');
  $('tools').classList.toggle('hidden',id==='matrix'||id==='zenflow');
  $('emptyTrash').classList.toggle('hidden',id!=='trash'||!notes.some(n=>n.isTrashed));
  if(id==='inbox'||id==='trash')renderGrid();
  if(id==='matrix')renderMatrix();
}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* Inbox / Trash */
const ICON={
  edit:'<svg viewBox="0 0 24 24"><path d="m15.2 5.2 3.6 3.6M16.7 3.7a2.5 2.5 0 1 1 3.6 3.6L6.5 21H3v-3.6z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M19 7l-.9 12.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg>',
  restore:'<svg viewBox="0 0 24 24"><path d="M3 10h10a8 8 0 0 1 8 8v2M3 10l6 6m-6-6 6-6"/></svg>'
};
function renderGrid(){
  const trash=tab==='trash',q=query.trim().toLowerCase();
  const list=notes.filter(n=>n.isTrashed===trash&&(!q||(n.title+' '+n.content).toLowerCase().includes(q))).sort((a,b)=>b.updatedAt-a.updatedAt);
  $('empty').classList.toggle('hidden',list.length>0);
  $('emptyText').textContent=q?'No matching notes':trash?'Trash is empty':'No notes yet — tap + to add one';
  $('emptyTrash').classList.toggle('hidden',!trash||!notes.some(n=>n.isTrashed));
  $('grid').innerHTML=list.map((n,i)=>{
    const acts=trash
      ?`<button class="ok" data-a="restore" aria-label="Restore">${ICON.restore}</button><button class="danger" data-a="purge" aria-label="Delete forever">${ICON.trash}</button>`
      :`<button data-a="edit" aria-label="Edit">${ICON.edit}</button><button class="danger" data-a="trash" aria-label="Move to trash">${ICON.trash}</button>`;
    const zone=n.matrixZone!=='unassigned'&&!trash?`<span class="chip">${esc(ZONES.find(z=>z[0]===n.matrixZone)[1])}</span>`:'';
    const c=n.content.length>150?n.content.slice(0,150)+'…':n.content;
    return`<article class="card" data-id="${n.id}" style="animation-delay:${Math.min(i,10)*.04}s"><div class="card-top"><h3>${esc(n.title||'Untitled Note')}</h3><div class="acts">${acts}</div></div><p>${esc(c)}</p><div class="card-foot"><span>${new Date(n.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>${zone}</div></article>`}).join('');
}
$('grid').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const id=card.dataset.id,btn=e.target.closest('button[data-a]');
  const a=btn?btn.dataset.a:(tab==='inbox'?'edit':'');
  if(a==='edit')openNote(id);
  else if(a==='trash'){setNote(id,{isTrashed:true});toast('Moved to Trash');renderGrid()}
  else if(a==='restore'){setNote(id,{isTrashed:false});toast('Restored');renderGrid()}
  else if(a==='purge'){if(confirm('Permanently delete this note? This cannot be undone.')){notes=notes.filter(n=>n.id!==id);persist();renderGrid()}}
});
$('emptyTrash').onclick=()=>{if(confirm('Permanently delete everything in Trash?')){notes=notes.filter(n=>!n.isTrashed);persist();renderGrid()}};
$('search').addEventListener('input',e=>{query=e.target.value;renderGrid()});
function setNote(id,patch){const n=notes.find(x=>x.id===id);if(n){Object.assign(n,patch);if(!('matrixZone' in patch)&&!('isTrashed' in patch))n.updatedAt=Date.now();persist()}}

/* Note modal */
const open=(id)=>$(id).classList.add('show'), close=(id)=>$(id).classList.remove('show');
function openNote(id){
  const n=id&&notes.find(x=>x.id===id);
  $('noteId').value=n?n.id:'';$('noteTitle').value=n?n.title:'';$('noteText').value=n?n.content:'';
  $('noteModalTitle').textContent=n?'Edit Note':'Create Note';
  open('noteModal');setTimeout(()=>$('noteTitle').focus(),150);
}
$('fab').onclick=()=>openNote();
$('noteClose').onclick=$('noteCancel').onclick=()=>close('noteModal');
$('noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')close('noteModal')});
$('noteSave').onclick=()=>{
  const id=$('noteId').value,title=$('noteTitle').value.trim(),content=$('noteText').value.trim();
  if(!title&&!content){close('noteModal');return}
  if(id)setNote(id,{title,content});
  else notes.push({id:uid(),title,content,matrixZone:'unassigned',isTrashed:false,updatedAt:Date.now()});
  persist();close('noteModal');renderGrid();toast('Saved');
};

/* Matrix */
const fine=window.matchMedia&&matchMedia('(pointer:fine)').matches;
function renderMatrix(){
  ZONES.forEach(z=>$('zone-'+z[0]).innerHTML='');
  let u=0;
  notes.filter(n=>!n.isTrashed).sort((a,b)=>b.updatedAt-a.updatedAt).forEach(n=>{
    if(n.matrixZone==='unassigned')u++;
    $('zone-'+n.matrixZone).insertAdjacentHTML('beforeend',`<div class="mini" data-id="${n.id}" ${fine?'draggable="true"':''}><h4>${esc(n.title||'Untitled')}</h4><p>${esc(n.content)}</p></div>`);
  });
  $('uCount').textContent=u;
  ZONES.forEach(z=>{const el=$('zone-'+z[0]);if(!el.children.length&&z[0]!=='unassigned')el.innerHTML='<div class="hint" style="margin:auto">Empty</div>'});
}
let moveId=null;
$('view-matrix').addEventListener('click',e=>{
  const m=e.target.closest('.mini');if(!m)return;
  moveId=m.dataset.id;const cur=notes.find(n=>n.id===moveId)?.matrixZone;
  $('moveList').innerHTML=ZONES.map(z=>`<button class="mv ${z[0]===cur?'cur':''}" data-z="${z[0]}"><span class="dot" style="background:${z[2]}"></span>${z[1]}</button>`).join('');
  open('moveModal');
});
$('moveList').addEventListener('click',e=>{const b=e.target.closest('.mv');if(!b)return;setNote(moveId,{matrixZone:b.dataset.z});close('moveModal');renderMatrix()});
$('moveClose').onclick=()=>close('moveModal');
$('moveModal').addEventListener('click',e=>{if(e.target.id==='moveModal')close('moveModal')});
/* Mouse drag & drop (desktop) */
let dragId=null;
document.addEventListener('dragstart',e=>{const m=e.target.closest&&e.target.closest('.mini');if(!m)return;dragId=m.dataset.id;m.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
document.querySelectorAll('.zone').forEach(z=>{
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||dragId;if(id){setNote(id,{matrixZone:z.dataset.zone});renderMatrix()}});
});

/* Zen Flow — timer uses an end timestamp so it stays accurate if the app is paused */
const zen={dur:25*60,left:25*60,end:0,iv:null,run:false};
const zt=()=>{const s=Math.max(0,zen.left);$('zenTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function zenUI(){
  $('zenToggle').textContent=zen.run?'Pause Focus':(zen.left<zen.dur&&zen.left>0?'Resume Focus':'Start Focus');
  $('zenToggle').className='btn '+(zen.run?'r':'p');
  document.body.classList.toggle('focus',zen.run);
}
function zenStop(){clearInterval(zen.iv);zen.iv=null;zen.run=false}
function zenTick(){
  zen.left=Math.max(0,Math.ceil((zen.end-Date.now())/1000));zt();
  if(zen.left<=0){zenStop();zen.left=zen.dur;zt();zenUI();beep();toast('Focus session complete 🎉')}
}
$('zenToggle').onclick=()=>{
  unlock();
  if(zen.run){zenStop();zenUI();return}
  if(zen.left<=0)zen.left=zen.dur;
  zen.run=true;zen.end=Date.now()+zen.left*1000;zen.iv=setInterval(zenTick,250);zenUI();
};
$('zenReset').onclick=()=>{zenStop();zen.left=zen.dur;zt();zenUI()};
$('durs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||zen.run)return;
  document.querySelectorAll('#durs button').forEach(x=>x.classList.toggle('on',x===b));zen.dur=zen.left=+b.dataset.m*60;zt();zenUI()});
$('zenSave').onclick=()=>{
  const title=$('zenTitle').value.trim(),content=$('zenText').value.trim();
  if(!title&&!content){toast('Nothing to save yet');return}
  notes.push({id:uid(),title,content,matrixZone:'unassigned',isTrashed:false,updatedAt:Date.now()});persist();
  $('zenTitle').value=$('zenText').value='';ls.set(DRAFT,'');
  zenStop();zen.left=zen.dur;zt();zenUI();switchTab('inbox');toast('Saved to Inbox');
};
function saveDraft(){ls.set(DRAFT,JSON.stringify({t:$('zenTitle').value,c:$('zenText').value}))}
$('zenTitle').addEventListener('input',saveDraft);$('zenText').addEventListener('input',saveDraft);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&zen.run)zenTick()});

/* Android back button (works inside the Capacitor app) */
function onBack(){
  if($('noteModal').classList.contains('show')){close('noteModal');return}
  if($('moveModal').classList.contains('show')){close('moveModal');return}
  if(zen.run){zenStop();zenUI();return}
  if(tab!=='inbox'){switchTab('inbox');return}
  try{window.Capacitor.Plugins.App.exitApp()}catch{}
}
try{window.Capacitor.Plugins.App.addListener('backButton',onBack)}catch{}

/* Boot */
load();
try{const d=JSON.parse(ls.get(DRAFT)||'null');if(d){$('zenTitle').value=d.t||'';$('zenText').value=d.c||''}}catch{}
zt();zenUI();switchTab('inbox');
</script>
</body>
</html>
